spring.application.name=fastrelax-api
spring.config.import=optional:file:.env[.properties]

# =========================================
# SERVER
# =========================================
server.port=8090
server.servlet.context-path=/api/v1

# =========================================
# DATABASE
# =========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================
# FLYWAY
# =========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# =========================================
# JPA / HIBERNATE
# =========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================
# FUSO HORÁRIO
# =========================================
# Todas as regras de horário usam o fuso da JVM. Em container o padrão é UTC,
# o que quebraria a janela de horário permitido e a expiração de sessões.
app.timezone=America/Sao_Paulo

# =========================================
# SECURITY
# =========================================
spring.security.user.name=admin
spring.security.user.password=admin
api.security.token.secret=${JWT_SECRET}
app.crypto.secret=${AES_SECRET}

# Uma semana de acesso, para painel e colaborador.
#
# O que sustenta o prazo longo é o SecurityFilter: ele carrega o usuário ou o
# colaborador do banco a cada requisição e recusa quem não está mais habilitado.
# Desativar uma pessoa, ou suspender a empresa, corta o acesso na hora — não
# depende de o token vencer.
#
# O que o prazo longo custa: um token vazado vale até a semana acabar. Trocar a
# senha derruba os refresh tokens, não os JWT já emitidos. Se isso passar a
# importar, o caminho é renovar pelo refresh em vez de encurtar isto de novo.
api.security.token.expiration-hours=168
api.security.refresh-token.expiration-days=30
app.security.refresh-token.cleanup-cron=0 0 3 * * *

# Limite de tentativas de login por IP. Vale para os dois logins; sem ele, uma
# varredura de CPFs contra um CNPJ conhecido seria barata.
app.security.login.max-attempts=10
app.security.login.window-minutes=5

# =========================================
# CORS (painel do RH)
# =========================================
# Origens liberadas no navegador. Definido no .env (CORS_ALLOWED_ORIGINS); o
# default cobre a máquina local e as faixas privadas usadas na rede da empresa.
# Nenhum endereço público entra aqui — a API não é exposta na internet.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*}

# =========================================
# SESSÕES
# =========================================
app.sessions.expiration-interval-ms=30000

# =========================================
# DOCUMENTAÇÃO / ACTUATOR
# =========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# =========================================
# CADEIRAS (ESP32)
# =========================================
# Sem segredo compartilhado aqui: cada cadeira gera o próprio token no
# primeiro boot (NVS) e pareia com o backend no primeiro heartbeat — ver
# Chair#deviceTokenEncrypted e ChairService#authenticateDevice.
# Timeout curto: o colaborador está em frente à cadeira esperando resposta.
app.chair.request-timeout-ms=3000
# Sem heartbeat por este tempo, a cadeira é considerada offline. Use ao menos o
# triplo do intervalo configurado no firmware.
app.chair.offline-after-seconds=180
# Espera do ESP32 antes de acionar o relé, para a pessoa se acomodar.
app.chair.start-delay-seconds=5
# Tempo que a cadeira leva se estabilizando depois de desligada, antes de aceitar
# outra sessão. Precisa bater com CHAIR_COOLDOWN_MS no config.h do firmware — o
# ESP32 é quem recusa de fato; este valor decide se o backend recusa cedo ou
# gasta a viagem até o dispositivo para ouvir o mesmo não.
app.chair.cooldown-seconds=40
# Frequência com que o monitor verifica a presença das cadeiras.
app.chair.monitor-interval-ms=30000

# =========================================
# RABBITMQ (comandos de cadeira via AMQP)
# =========================================
# O firmware fala MQTT puro (PubSubClient); o backend fala AMQP nativo — o
# plugin rabbitmq_mqtt do broker traduz os dois lados pela exchange padrão
# `amq.topic` (tópico `fastrelax/chairs/<mac>/status` vira routing key
# `fastrelax.chairs.<mac>.status`, barra por ponto). Sem cliente MQTT aqui.
#
# Mesmo host/usuário/senha que o firmware usa em MQTT_HOST/MQTT_USERNAME/
# MQTT_PASSWORD no config.h — só a porta muda (5672 AMQP, não 1883 MQTT).
spring.rabbitmq.host=${MQTT_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_AMQP_PORT:5672}
spring.rabbitmq.username=${MQTT_USERNAME:guest}
spring.rabbitmq.password=${MQTT_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
# O indicador de saúde do Rabbit conectaria a cada /actuator/health. Com o
# transporte desligado por padrão (app.mqtt.enabled=false), isso só produziria
# alarme falso em ambiente sem broker configurado.
management.health.rabbit.enabled=false

# Desligado por padrão, espelhando MQTT_ENABLED=0 no config.h do firmware: até
# uma cadeira de verdade falar MQTT, ligar isto aqui não teria efeito nenhum.
# Enquanto desligado, ChairClient usa só HTTP, como sempre usou, e nenhuma fila
# ou binding é declarada — zero conexão ao RabbitMQ.
app.mqtt.enabled=${MQTT_ENABLED:false}
# Precisa ser o mesmo valor de MQTT_TOPIC_PREFIX no config.h do firmware
# (com barra; a conversão para ponto acontece só na routing key).
app.mqtt.topic-prefix=${MQTT_TOPIC_PREFIX:fastrelax/chairs}
# Quanto esperar pelo ack antes de considerar a cadeira sem resposta. Mais
# folgado que o timeout HTTP porque a viagem passa pelo broker, mas ainda
# curto: o colaborador está em frente à cadeira esperando.
app.mqtt.command-timeout-ms=${MQTT_COMMAND_TIMEOUT_MS:5000}

# Broker que as cadeiras (ESP32) falam — porta 1883, MQTT puro, não confundir
# com o app.mqtt.enabled acima (que é só o transporte AMQP do backend). Usado
# para popular POST /mqtt de uma cadeira sem override próprio: mesmo
# host/usuário/senha do spring.rabbitmq.* acima, porta diferente.
app.mqtt.device-host=${MQTT_HOST:localhost}
app.mqtt.device-port=${MQTT_DEVICE_PORT:1883}
app.mqtt.device-username=${MQTT_USERNAME:guest}
app.mqtt.device-password=${MQTT_PASSWORD:guest}

# =========================================
# NOTIFICAÇÕES (push)
# =========================================
# Faixas de lembrete rolantes, em minutos antes do início. Acrescentar uma faixa
# é acrescentar um número aqui — o banco guarda a marca por (sessão, faixa).
app.notifications.reminder-offsets=60,5

# Tick curto de propósito: com 10 minutos, o lembrete de 5 poderia sair depois
# da hora da massagem. A consulta é indexada e barata.
app.notifications.reminder-interval-ms=60000

# Resumo da véspera: avisa quem tem massagem amanhã. É por calendário, não por
# offset — "1 dia antes" como 1440 minutos rolantes dispararia junto com a
# confirmação para quem agenda com menos de 24h.
app.notifications.daily-digest-cron=0 0 10 * * *

# Web Push (navegador): par de chaves VAPID. Gere uma vez com
#   npx web-push generate-vapid-keys
# e guarde no .env. Trocar o par obriga todos os navegadores a se reinscreverem.
app.push.webpush.public-key=${WEBPUSH_PUBLIC_KEY:}
app.push.webpush.private-key=${WEBPUSH_PRIVATE_KEY:}
app.push.webpush.subject=${WEBPUSH_SUBJECT:mailto:ti@fastrelax.local}

# FCM (app Android/iOS): caminho do JSON da conta de serviço do Firebase.
# Vazio deixa o provedor inerte — a notificação continua sendo gravada e
# aparece na central do app, só não vira push no aparelho.
app.push.fcm.credentials-file=${FCM_CREDENTIALS_FILE:}

# =========================================
# UPLOAD (importação de planilhas)
# =========================================
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# =========================================
# ERROS
# =========================================
# Expõe classe, mensagem e início do stacktrace no corpo da resposta 500.
# DESLIGAR EM PRODUÇÃO: revela estrutura interna do código e do banco.
app.errors.include-details=true

# =========================================
# LOGGING
# =========================================
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
# =========================================
# E-MAIL (convite de primeiro acesso e recuperação de senha)
# =========================================
# Transporte. O padrão é o SMTP do Gmail; MAIL_PASSWORD é a "senha de app"
# gerada em https://myaccount.google.com/apppasswords — a senha da conta não
# funciona, e a geração exige verificação em duas etapas ligada.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Sem timeout, um SMTP que não responde segura a thread do cadastro até o
# sistema operacional desistir — minutos, com o RH olhando para a tela.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Desligado por padrão: sem isto, subir em desenvolvimento sem SMTP faria todo
# cadastro tentar uma conexão fadada a falhar. Desligado, o cadastro cai na
# senha temporária exibida na tela, e o corpo do e-mail vai para o log em DEBUG.
app.mail.enabled=${MAIL_ENABLED:false}
# No Gmail precisa ser a própria conta autenticada: o servidor recusa um From de
# outro domínio.
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:FastRelax}
# Base pública do frontend, usada para montar os links de convite e recuperação.
# Vem da configuração e não do cabeçalho Host: o Host é controlado por quem
# chama, e usá-lo permitiria forjar um link apontando para outro domínio — com
# um token válido dentro.
app.mail.app-base-url=${WEB_BASE_URL:http://localhost}

# Validade dos links enviados por e-mail.
# Convite é folgado (a pessoa ainda não tem senha nenhuma); recuperação é curta,
# porque quem pediu está com a caixa de entrada aberta agora e a senha atual
# continua funcionando enquanto isso.
app.security.credential-token.invite-hours=48
app.security.credential-token.reset-hours=2
