spring.application.name=fastrelax-api
spring.config.import=optional:file:.env[.properties]

# =========================================
# SERVER
# =========================================
server.port=8090
server.servlet.context-path=/api/v1

# =========================================
# DATABASE
# =========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================
# FLYWAY
# =========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# =========================================
# JPA / HIBERNATE
# =========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================
# FUSO HORÁRIO
# =========================================
# Todas as regras de horário usam o fuso da JVM. Em container o padrão é UTC,
# o que quebraria a janela de almoço e a expiração de sessões.
app.timezone=America/Sao_Paulo

# =========================================
# SECURITY
# =========================================
spring.security.user.name=admin
spring.security.user.password=admin
api.security.token.secret=${JWT_SECRET}
app.crypto.secret=${AES_SECRET}

# Token de acesso (curto) e refresh token (longo)
api.security.token.expiration-hours=2
api.security.refresh-token.expiration-days=30
app.security.refresh-token.cleanup-cron=0 0 3 * * *

# Limite de tentativas de login por IP. O login do colaborador usa só o CPF,
# então sem isto uma varredura de CPFs seria trivial.
app.security.login.max-attempts=10
app.security.login.window-minutes=5

# =========================================
# CORS (painel do RH)
# =========================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4200

# =========================================
# SESSÕES
# =========================================
app.sessions.expiration-interval-ms=30000

# =========================================
# DOCUMENTAÇÃO / ACTUATOR
# =========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# =========================================
# UPLOAD (importação de planilhas)
# =========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# =========================================
# ERROS
# =========================================
# Expõe classe, mensagem e início do stacktrace no corpo da resposta 500.
# DESLIGAR EM PRODUÇÃO: revela estrutura interna do código e do banco.
app.errors.include-details=true

# =========================================
# LOGGING
# =========================================
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG