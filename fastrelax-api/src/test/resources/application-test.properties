# =========================================
# PERFIL DE TESTE
# =========================================
# Sobrepõe o application.properties principal; tudo que não estiver aqui
# continua valendo.
#
# Existe por um motivo concreto: sem ele o `contextLoads` sobe contra o banco de
# desenvolvimento, e toda edição em V1__initial_schema.sql derrubava o build com
# "Migration checksum mismatch" — falha de ambiente lida como falha de código.

# -----------------------------------------
# BANCO DEDICADO
# -----------------------------------------
# Banco separado do de desenvolvimento. Crie uma vez, se ainda não existir:
#   createdb -h localhost -U postgres fastrelax_test
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/fastrelax_test}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}

# -----------------------------------------
# FLYWAY: LIMPA SOZINHO
# -----------------------------------------
# ATENÇÃO: `clean` APAGA O BANCO INTEIRO. Só é liberado aqui porque o alvo é o
# fastrelax_test, descartável por definição. Nunca ative isto no perfil padrão
# nem em produção.
#
# Enquanto V1 for reescrita — o schema ainda é pré-lançamento —, o checksum muda
# a cada edição. Recriar do zero é o comportamento certo para teste: cada
# execução parte do schema que está no repositório, não do que sobrou da última.
spring.flyway.clean-disabled=false
# A estratégia de migração do perfil vive em TestDatabaseConfig: `clean` + `migrate`
# a cada execução. (`clean-on-validation-error` saiu no Flyway 11.)

# -----------------------------------------
# SEGREDOS
# -----------------------------------------
# Valores fixos e sem valor nenhum, para a suíte rodar em máquina sem .env (CI
# incluído). Os do .env continuam vencendo quando existirem.
api.security.token.secret=${JWT_SECRET:test-jwt-secret-nao-usar-fora-de-teste-0123456789}
app.crypto.secret=${AES_SECRET:test-aes-secret-nao-usar-fora-de-teste-0123456789}

# -----------------------------------------
# EFEITOS COLATERAIS DESLIGADOS
# -----------------------------------------
# Teste não manda e-mail nem push, e não fica varrendo sessão em background.
app.mail.enabled=false
app.push.webpush.public-key=
app.push.webpush.private-key=
app.push.fcm.credentials-file=

# O log de SQL e de segurança serve para depurar a aplicação rodando; na suíte
# só afoga a saída do Maven.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
logging.level.org.springframework.boot.autoconfigure.flyway=INFO
